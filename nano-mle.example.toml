# nano-mle configuration. Copy to nano-mle.toml (gitignored) and adjust.
# Without nano-mle.toml these defaults apply. NANO_MLE_CONFIG points to another file.
# Each run records the configuration it used in its workspace metadata.

[execution]
# Cores the workers may use; 0 means all. Workers are pinned to the first cpu_threads
# cores, so this holds even when a plan sets n_jobs=-1, and concurrent runs share them.
cpu_threads = 32
# Grid-search variants/folds fitted in parallel processes. Each parallel fit gets
# cpu_threads // grid_n_jobs threads. Every job receives its own copy of X and y,
# so values above 1 only pay off for small data with many cheap fits. Probes always
# fit folds sequentially with all threads.
grid_n_jobs = 1

[hardware]
# What the controller, planner and writer are told about the machine this run may
# use (context.hardware, together with [execution] cpu_threads). Stated here, never
# probed: with runs in parallel the node holds more than one run may use. Make the
# GPU list match what the run can see (CUDA_VISIBLE_DEVICES). 0 or [] means not stated.
memory_gb = 0
gpus = []            # e.g. ["NVIDIA A100-SXM4-80GB, 80 GB"]

[plans]
# Restrict apply_func / call nodes to the curated list of library primitives in
# graphs.PRIMITIVES. Disabled for now so the agent may call any library function;
# functions defined in the plan and lambdas are rejected either way (no UDFs).
restrict_primitives = false

# Prompt set parameters, read at `nano-mle init --prompts <name>` (default: default)
# and recorded in the workspace. A variant registered in prompts.PROMPTS takes its
# parameters from [prompts.<its name>].
[prompts.default]
# Add the "data volume study" convention (planner and controller): for large sources,
# decide the modelled population with evidence, i.e. explore which rows and table
# parts are needed before the lock and measure a learning curve after it.
data_volume_study = true

# Memory parameters, read at `nano-mle init --memory <name>` and recorded in the
# workspace. Omitted keys use the defaults shown.
[memory.window]
# leaderboard = 8     # best candidates shown
# explorations = 4    # latest explorations shown, with their output previews
# failures = 4        # latest failed candidates shown
# trajectory = 6      # ancestors of the selected parent shown

[memory.full]
# max_chars = 400000  # JSON size cap; oldest explorations, then failures, then
#                     # lowest-ranked candidates are omitted beyond it

[memory.aide]
# All valid candidates are shown as concise summaries, in creation order.
explorations = 4     # latest explorations, so evaluation preparation keeps its evidence

# Policy/controller parameters are also read at init and saved in the workspace.
# Changing this file does not change these choices on resume.
[policy.greedy]

[policy.draft-greedy]
num_drafts = 5       # first N expansion attempts select root, including planner failures

[policy.mcts]
exploration = 1.414  # UCT exploration coefficient

[policy.mcgs]
seed = 42
exploration = 1.414

[controller.llm]

[controller.auto]
# Stop when remaining seconds < time_margin * the longest of the last 3 completed
# expansions' worker time (all attempts, repairs included). Model calls are not
# counted, so it is a heuristic. With no expansion history the first expansion is
# allowed. 0 disables the estimate.
time_margin = 1.0

# Model per role. By default every role uses the run's --model (with its
# --reasoning-effort, --max-tokens, --request-timeout). A [models.<role>] table
# overrides it for one role; roles are controller, planner, writer, repairer,
# interpreter, summarizer. Keys: model, reasoning_effort, max_tokens, timeout,
# api_base. A role given another model does not inherit --reasoning-effort.
# [models.writer]
# model = "openai/gpt-6.1-sol"
# reasoning_effort = "medium"
# api_base = "http://127.0.0.1:10531/v1"
